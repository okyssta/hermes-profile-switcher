name: profile-switcher
label: Profile Switcher
version: 1.0.0
manifest_version: 2
api_version: 1
license: MIT
author: okyssta
homepage: https://github.com/okyssta/hermes-profile-switcher
description: >
  A macOS-style quick switcher for Hermes profiles in the Hermes Desktop app.
  One chord (⌥⌘P by default, rebindable in the app's own keybind panel) opens a
  panel listing every profile with its model and most recent conversation; ↑ ↓
  (or Tab) move the highlight and Enter lands you in the profile you pick.
  A status-bar chip names the active profile and opens the same panel on click.
  The switch goes through the Desktop's own profile path, so the target
  profile's backend is activated and its chrome is scoped onto it.
  Desktop-only (desktop/plugin.js inside the plugin SDK surface); no agent
  tools, hooks, middleware, env vars, network calls, or stored credentials.
tags: [desktop, profiles, productivity, keyboard]

# The Desktop app's floating-pane placement, the contributed-keybind area,
# and the cross-profile `host.openSession` switch all landed in Hermes
# 0.21.6; that is the floor this plugin is written against.
requires_hermes: ">=0.21.6"

# NOTE: no `config_schema` here on purpose. A manifest `config_schema` makes
# the app render an AUTOMATIC settings page for the agent half, while the
# desktop half registers its own page (Settings ▸ Plugins) backed by
# `ctx.storage`. Two pages, two stores, two sets of toggles that disagree.
# The desktop page is the single source of truth, so the manifest declares
# no agent-side settings.
